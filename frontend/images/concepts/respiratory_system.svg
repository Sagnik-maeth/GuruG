<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="respBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="50%" stop-color="#0B1630"/>
      <stop offset="100%" stop-color="#081024"/>
    </linearGradient>

    <!-- Lung Gradient -->
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Alveolus Bubble Gradient -->
    <radialGradient id="alveolusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Capillary Blood Gradient: Blue (Deox) to Red (Ox) -->
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="640" height="400" rx="16" fill="url(#respBg)" stroke="#0284C7" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="25" y="16" width="590" height="46" rx="10" fill="rgba(14, 165, 233, 0.12)" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="42" y="36" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1">HUMAN RESPIRATORY SYSTEM &amp; ALVEOLAR GAS EXCHANGE</text>
  <text x="42" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pulmonary Ventilation (Boyle's Law: P₁V₁ = P₂V₂) • O₂ Diffusion &amp; CO₂ Excretion</text>

  <!-- ========================================== -->
  <!-- LEFT PANEL: RESPIRATORY ANATOMY SCHEMATIC -->
  <!-- ========================================== -->
  <g transform="translate(15, 65)">
    <!-- Subtitle Card -->
    <rect x="15" y="8" width="280" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="25" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Air Pathway &amp; Ventilatory Mechanics</text>

    <!-- Nasal Cavity & Pharynx -->
    <path d="M 148 42 Q 155 35 155 48 Q 155 60 148 68" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <text x="80" y="50" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Nasal Cavity</text>
    <line x1="140" y1="47" x2="148" y2="47" stroke="#38BDF8" stroke-width="1"/>

    <!-- Inhaled O2 Arrow -->
    <path d="M 172 38 L 155 48" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="3,2"/>
    <polygon points="152,47 160,43 158,52" fill="#22D3EE"/>
    <text x="176" y="42" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="9" font-weight="800">O₂ In</text>

    <!-- Pharynx & Larynx -->
    <circle cx="150" cy="74" r="6" fill="#0284C7"/>
    <text x="82" y="77" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Pharynx/Larynx</text>
    <line x1="138" y1="74" x2="144" y2="74" stroke="#64748B" stroke-width="1"/>

    <!-- Trachea (Windpipe) with Cartilage Rings -->
    <line x1="150" y1="80" x2="150" y2="128" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <!-- Cartilage Rings Notches -->
    <line x1="145" y1="88" x2="155" y2="88" stroke="#0B1630" stroke-width="1.8"/>
    <line x1="145" y1="96" x2="155" y2="96" stroke="#0B1630" stroke-width="1.8"/>
    <line x1="145" y1="104" x2="155" y2="104" stroke="#0B1630" stroke-width="1.8"/>
    <line x1="145" y1="112" x2="155" y2="112" stroke="#0B1630" stroke-width="1.8"/>
    <line x1="145" y1="120" x2="155" y2="120" stroke="#0B1630" stroke-width="1.8"/>
    <text x="65" y="105" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Trachea (Windpipe)</text>
    <line x1="135" y1="102" x2="144" y2="102" stroke="#94A3B8" stroke-width="1"/>

    <!-- Primary Bronchi Bifurcation -->
    <!-- Right Bronchus (visual left) -->
    <path d="M 150 128 Q 135 142 115 156" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <!-- Left Bronchus (visual right) -->
    <path d="M 150 128 Q 165 142 185 156" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

    <!-- LUNGS -->
    <!-- Right Lung (Visual Left - 3 Lobes) -->
    <path d="M 130 138 C 130 120, 80 135, 70 170 C 60 205, 65 240, 75 250 C 95 255, 128 250, 134 235 C 140 215, 138 165, 130 138 Z"
          fill="url(#lungGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="45" y="195" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Right Lung</text>
    <text x="50" y="208" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="8">(3 Lobes)</text>

    <!-- Left Lung (Visual Right - 2 Lobes + Cardiac Notch) -->
    <path d="M 170 138 C 170 120, 220 135, 230 170 C 240 205, 232 240, 222 250 C 205 255, 172 250, 168 235 C 160 210, 165 165, 170 138 Z"
          fill="url(#lungGrad)" stroke="#818CF8" stroke-width="2"/>
    <text x="215" y="195" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Left Lung</text>
    <text x="215" y="208" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="8">(Cardiac Notch)</text>

    <!-- Bronchial Tree Arborization Inside Lungs -->
    <!-- Inside Right Lung -->
    <path d="M 115 156 Q 95 175 88 200" fill="none" stroke="#0284C7" stroke-width="2.5"/>
    <path d="M 105 168 Q 118 185 116 215" fill="none" stroke="#0284C7" stroke-width="2"/>
    <path d="M 88 200 Q 80 220 84 235" fill="none" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Inside Left Lung -->
    <path d="M 185 156 Q 205 175 212 200" fill="none" stroke="#6366F1" stroke-width="2.5"/>
    <path d="M 195 168 Q 182 185 184 215" fill="none" stroke="#6366F1" stroke-width="2"/>
    <path d="M 212 200 Q 220 220 214 235" fill="none" stroke="#6366F1" stroke-width="1.5"/>

    <!-- Diaphragm Dome Muscle -->
    <path d="M 55 264 Q 150 244 245 264 Q 150 252 55 264 Z" fill="#F43F5E" fill-opacity="0.85" stroke="#FB7185" stroke-width="2"/>
    <text x="115" y="278" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Diaphragm Muscle</text>

    <!-- Ventilation Arrows on Diaphragm -->
    <!-- Down Arrow: Inhalation -->
    <path d="M 90 268 L 90 286" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <polygon points="86,284 94,284 90,290" fill="#22D3EE"/>
    <text x="50" y="295" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Inhale (Contracts ↓)</text>

    <!-- Up Arrow: Exhalation -->
    <path d="M 210 288 L 210 270" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
    <polygon points="206,272 214,272 210,266" fill="#F43F5E"/>
    <text x="180" y="295" fill="#FB7185" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Exhale (Relaxes ↑)</text>
  </g>

  <!-- Connective Callout dashed line from Bronchiole to Alveolus Zoom -->
  <path d="M 235 270 Q 300 240 345 205" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="345,200 352,208 340,208" fill="#38BDF8"/>

  <!-- ============================================== -->
  <!-- RIGHT PANEL: ALVEOLAR GAS EXCHANGE ZOOM BUBBLE -->
  <!-- ============================================== -->
  <g transform="translate(325, 68)">
    <!-- Alveolus Magnification Box -->
    <rect x="0" y="0" width="288" height="235" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="#0284C7" stroke-width="1.5"/>

    <!-- Microscopic Zoom Header Tag -->
    <rect x="12" y="10" width="264" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="22" y="26" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">MICROSCOPIC ALVEOLUS &amp; CAPILLARY EXCHANGE</text>

    <!-- Central Alveolar Sac Circle -->
    <circle cx="138" cy="115" r="56" fill="url(#alveolusGrad)" stroke="#38BDF8" stroke-width="2.5" filter="url(#cyanGlow)"/>
    <text x="96" y="98" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Alveolar Sac</text>
    <text x="100" y="112" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="9">(Air Space: P_O₂ High)</text>

    <!-- Capillary Vessel Wrapping Around Alveolus (U-Shape) -->
    <path d="M 45 60 C 50 180, 226 180, 230 60" fill="none" stroke="url(#bloodGrad)" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
    <path d="M 45 60 C 50 180, 226 180, 230 60" fill="none" stroke="#0F172A" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Capillary Blood Flow Direction Arrows -->
    <!-- Inflow: Deoxygenated Blue Blood -->
    <path d="M 46 65 L 47 90" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="43,88 51,88 47,95" fill="#FFFFFF"/>
    <text x="12" y="52" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Deoxygenated Blood</text>
    <text x="14" y="64" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="8">(From Pulmonary Artery)</text>

    <!-- Outflow: Oxygenated Red Blood -->
    <path d="M 229 90 L 228 65" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="224,67 232,67 228,60" fill="#FFFFFF"/>
    <text x="180" y="52" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Oxygenated Blood</text>
    <text x="182" y="64" fill="#F87171" font-family="system-ui, sans-serif" font-size="8">(To Pulmonary Vein)</text>

    <!-- GAS DIFFUSION ARROWS -->
    <!-- 1. Oxygen (O2) Diffusion into Capillary -->
    <g transform="translate(138, 115)">
      <line x1="0" y1="12" x2="25" y2="40" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="20,42 30,44 26,34" fill="#38BDF8"/>
      <rect x="2" y="38" width="46" height="18" rx="4" fill="#0369A1"/>
      <text x="6" y="51" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">O₂ Enters</text>
    </g>

    <!-- 2. Carbon Dioxide (CO2) Excretion into Alveolus -->
    <g transform="translate(138, 115)">
      <line x1="-30" y1="42" x2="-8" y2="14" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-12,12 -5,11 -9,20" fill="#F43F5E"/>
      <rect x="-48" y="38" width="46" height="18" rx="4" fill="#BE123C"/>
      <text x="-44" y="51" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">CO₂ Leaves</text>
    </g>

    <!-- Red Blood Cells (RBCs) in Capillary -->
    <ellipse cx="62" cy="140" rx="7" ry="5" fill="#3B82F6" stroke="#93C5FD" stroke-width="1"/>
    <ellipse cx="100" cy="170" rx="7" ry="5" fill="#8B5CF6" stroke="#C4B5FD" stroke-width="1"/>
    <ellipse cx="138" cy="174" rx="7" ry="5" fill="#DC2626" stroke="#FCA5A5" stroke-width="1"/>
    <ellipse cx="178" cy="170" rx="7" ry="5" fill="#EF4444" stroke="#FCA5A5" stroke-width="1"/>
    <ellipse cx="214" cy="140" rx="7" ry="5" fill="#EF4444" stroke="#FCA5A5" stroke-width="1"/>

    <!-- Key Principle Mini-Note -->
    <rect x="12" y="196" width="264" height="28" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="209" fill="#FDE047" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Fick's Law of Diffusion:</text>
    <text x="20" y="219" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Diffusion Rate ∝ (Surface Area × ΔP) / Membrane Thickness</text>
  </g>

  <!-- ========================================== -->
  <!-- BOTTOM FOOTER: GOVERNING FORMULAS & LAWS -->
  <!-- ========================================== -->
  <g transform="translate(25, 316)">
    <!-- Box 1: Boyle's Law of Pulmonary Ventilation -->
    <rect x="0" y="0" width="188" height="68" rx="10" fill="rgba(14, 165, 233, 0.08)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="12" y="18" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">BOYLE'S LAW (VENTILATION)</text>
    <text x="12" y="38" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" font-weight="bold">P₁ · V₁ = P₂ · V₂</text>
    <text x="12" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Volume ↑ leads to Pressure ↓ (Inhale)</text>

    <!-- Box 2: Alveolar Ventilation Formula -->
    <rect x="200" y="0" width="188" height="68" rx="10" fill="rgba(99, 102, 241, 0.08)" stroke="#6366F1" stroke-width="1.2"/>
    <text x="212" y="18" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">ALVEOLAR VENTILATION RATE</text>
    <text x="212" y="38" fill="#FFFFFF" font-family="Georgia, serif" font-size="13" font-weight="bold">V̇_A = (V_T - V_D) × f</text>
    <text x="212" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Tidal Volume minus Dead Space × Freq</text>

    <!-- Box 3: Cellular Respiration Link -->
    <rect x="400" y="0" width="190" height="68" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.2"/>
    <text x="412" y="18" fill="#34D399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">CELLULAR RESPIRATION</text>
    <text x="412" y="38" fill="#FFFFFF" font-family="Georgia, serif" font-size="11.5" font-weight="bold">C₆H₁₂O₆ + 6O₂ → 6CO₂ + ATP</text>
    <text x="412" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Oxygen fuels aerobic ATP production</text>
  </g>
</svg>